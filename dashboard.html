<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operações – Coamo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── PRINT / PDF ── */
    @media print {
      header, .tabs, .btn-exportar, .btn-block, .btn-logout, .btn-gerenciar,
      .rotina-actions select, .rotina-actions button,
      input, textarea, select { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      /* Só imprime a aba ativa — todas as outras ficam ocultas */
      .tab-content { display: none !important; }
      .tab-content.active { display: block !important; padding: 0 !important; }
      .rotina-item {
        border: 1px solid #ddd; margin-bottom: 5px; padding: 6px 8px;
        border-radius: 4px; break-inside: avoid;
        border-left: 3px solid #ccc !important;
        background: #fff !important; opacity: 1 !important;
      }
      .rotina-item.erro  { border-left-color: #cf222e !important; background: #fff5f5 !important; }
      .rotina-item.done  { border-left-color: #1a7f37 !important; }
      .rotina-item.blocked { display: none !important; }
      .rotina-time    { color: #0550ae; font-weight: 700; }
      .rotina-text    { color: #000; font-weight: 600; }
      .rotina-obs     { color: #555; }
      .rotina-caminho { color: #0550ae; }
      .rotina-section h3 { color: #0550ae; border-bottom: 1px solid #ccc; }
      .movimento-header {
        color: #000; font-size: 1rem; font-weight: bold;
        margin-bottom: 10px; border: 1px solid #ccc; padding: 6px 10px;
        background: #f0f6ff !important;
      }
      .corvu-table th { background: #e8f0fe !important; color: #000; text-align: center; }
      .corvu-table td, .corvu-table th { border: 1px solid #ccc; padding: 4px 6px; }
      .corvu-nome { color: #000; }
      .aviso-dia-anterior { background: #fff8e1 !important; color: #7a4f00; border-color: #f0c040; }
      .aviso-corvu-mensal { background: #fff8e1 !important; color: #7a4f00; border-color: #f0c040; }
      .erro-msg-view { color: #cf222e !important; }
      .print-value {
        display: inline !important; font-size: 0.82rem;
        font-weight: 600; padding: 0 2px;
      }
      .hora-row { display: flex !important; gap: 8px; margin-top: 4px; }
      .hora-label { color: #555; font-size: 0.75rem; }
      /* Campos de texto nos campos extras */
      .rotina-campos-wrap, .campo-label-wrap, .campo-label { display: flex !important; }
    }

    /* Ocultar linhas PDF fora do print */
    .pdf-rotina-linha { display: none; }
    /* Botão Gerenciar Rotinas — admin only */
    .btn-gerenciar {
      background: rgba(139,92,246,0.15); color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.3);
      padding: 5px 12px; border-radius: 6px; cursor: pointer;
      font-size: 0.82rem; font-weight: 600; transition: background 0.2s;
    }
    .btn-gerenciar:hover { background: rgba(139,92,246,0.28); }
    /* Chamado exibido apos encerrar */
    .chamado-encerrado {
      font-size: 0.82rem; font-weight: 600; color: #1a7f37;
      margin-top: 4px; padding: 2px 4px;
      background: #e6f4ea; border-radius: 4px; display: inline-block;
    }
    /* Botão de observação do operador */
    .btn-obs {
      background: rgba(251,191,36,0.15); color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.3);
      padding: 3px 7px; border-radius: 5px; cursor: pointer;
      font-size: 0.78rem; font-weight: 600; transition: background 0.2s;
      margin-left: 4px;
    }
    .btn-obs:hover { background: rgba(251,191,36,0.3); }
    .btn-obs.tem-obs { background: rgba(251,191,36,0.25); color: #f59e0b; border-color: rgba(251,191,36,0.5); }
    /* Área de obs inline */
    .obs-operador-wrap { margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
    .obs-operador-input {
      flex: 1; background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.3);
      border-radius: 6px; color: #fde68a; font-size: 0.82rem; padding: 5px 8px;
      resize: vertical; min-height: 36px; outline: none; font-family: inherit;
    }
    .obs-operador-input:focus { border-color: rgba(251,191,36,0.6); }
    .obs-operador-salvar {
      background: rgba(251,191,36,0.2); color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.4); border-radius: 5px;
      padding: 4px 10px; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
    }
    .obs-operador-salvar:hover { background: rgba(251,191,36,0.35); }
    /* Exibição da obs salva */
    .obs-operador-view {
      margin-top: 5px; font-size: 0.82rem; color: #fde68a;
      background: rgba(251,191,36,0.08); border-left: 3px solid #fbbf24;
      padding: 4px 8px; border-radius: 0 5px 5px 0;
    }
    .obs-operador-view strong { color: #fbbf24; margin-right: 4px; }
  </style>
</head>
<body>
<header>
  <h1>⚙️ Sistema de Operações – Coamo</h1>
  <div class="header-right">
    <span id="relogioHeader"></span>
    <span class="user-badge" id="userBadge"></span>
    <button class="btn-exportar" onclick="exportarPDF()" title="Exportar PDF">🖨️ Exportar PDF</button>
    <button class="btn-gerenciar" id="btnGerenciar" onclick="window.location.href='gerenciar-rotinas.html'" title="Gerenciar rotinas" style="display:none">⚙️ Rotinas</button>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</header>

<div class="tabs" id="tabBar"></div>

<div id="tab-diario"      class="tab-content active"></div>
<div id="tab-corvudiario" class="tab-content"></div>
<div id="tab-fds"         class="tab-content"></div>
<div id="tab-mensal"      class="tab-content"></div>
<div id="tab-corvumensal" class="tab-content"></div>
<div id="tab-anual"       class="tab-content"></div>

<script src="data.js"></script>
<script>
// ── AUTH ─────────────────────────────────────────────────────────────
const user  = sessionStorage.getItem('user');
const role  = sessionStorage.getItem('role');
const token = sessionStorage.getItem('token');
if (!user || !token || !['operador','admin'].includes(role)) {
  sessionStorage.clear(); window.location.href = 'index.html';
}
document.getElementById('userBadge').textContent = '👤 ' + user + ' (' + role + ')';
function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

// Mostra botão de gerenciar rotinas só para admin
function verificarBtnSincronizar() {
  if (role !== 'admin') return;
  const btnG = document.getElementById('btnGerenciar');
  if (btnG) btnG.style.display = 'inline-block';
}

// Cabeçalho de autenticação para todas as chamadas de API
function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

// ── PROTEÇÃO BÁSICA DE INSPEÇÃO ───────────────────────────────────────
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.key.toUpperCase() === 'U') { e.preventDefault(); return false; }
});

// ── ABAS ──────────────────────────────────────────────────────────────
const TABS = [
  { id:'diario',      label:'📋 Diário'          },
  { id:'corvudiario', label:'🖥️ Corvu Diário'    },
  { id:'fds',         label:'📆 Final de Semana' },
  { id:'mensal',      label:'📅 Mensal'           },
  { id:'corvumensal', label:'🖥️ Corvu Mensal'    },
  { id:'anual',       label:'📆 Anual'            },
];
let abaAtiva = 'diario';

// ── ABAS DINÂMICAS DO DIA ANTERIOR ───────────────────────────────────
// Verifica se há rotinas ou corvus do dia anterior com status registrado
// e cria/remove abas dinâmicas conforme necessário

// Seções que pertencem ao dia anterior (madrugada executada após virar o dia)
const SECOES_DIA_ANTERIOR = new Set(['Após meia-noite','Após 03:00h','Acompanhamento BI']);

// ── FDS DO DIA ATUAL — controle de sumir após 15 min ─────────────────
// Retorna true se a aba Final de Semana deve ser exibida.
// A aba fixa só aplica controle de sumiço durante sáb/dom.
// Em dias de semana, sempre exibe — o FDS anterior aparece como aba dinâmica ⚠️.
function fdsDiaAtualDeveExibir() {
  const hoje = new Date(diaAtual + 'T12:00:00');
  const diaSemana = hoje.getDay(); // 0=dom, 6=sab

  // Sexta, sábado e domingo: aba FDS visível
  // Seg–qui: não aparece
  if (diaSemana >= 1 && diaSemana <= 4) return false; // 1=seg, 2=ter, 3=qua, 4=qui

  // Sexta (diaSemana === 5): sempre exibe — operador visualiza o FDS que vem
  if (diaSemana === 5) return true;

  // É sábado ou domingo — aplica controle de sumiço
  let sabKey, domKey;
  if (diaSemana === 6) {
    sabKey = diaAtual;
    const dom = new Date(hoje); dom.setDate(dom.getDate() + 1);
    domKey = `${dom.getFullYear()}-${String(dom.getMonth()+1).padStart(2,'0')}-${String(dom.getDate()).padStart(2,'0')}`;
  } else {
    const sab = new Date(hoje); sab.setDate(sab.getDate() - 1);
    sabKey = `${sab.getFullYear()}-${String(sab.getMonth()+1).padStart(2,'0')}-${String(sab.getDate()).padStart(2,'0')}`;
    domKey = diaAtual;
  }

  // Status do sábado e do domingo (mesma chave de rotinas, dias diferentes)
  const sStatusSab = getStatus('fds', sabKey);
  const sStatusDom = getStatus('fds', domKey);

  // Se não há nenhum dado em nenhum dos dois dias → exibe normalmente (sem dados)
  const temAlgumDado =
    Object.values(sStatusSab).some(v => v && v.status) ||
    Object.values(sStatusDom).some(v => v && v.status);
  if (!temAlgumDado) return true;

  const DELAY_MS = 15 * 60 * 1000;
  const agora = new Date();

  // Rotinas normais (exceto corvus inline e semStatus)
  // Cada rotina pode ter sido salva no sábado OU no domingo (depende de quando o operador
  // preencheu — antes ou depois da meia-noite). Aceita encerrado+fim em qualquer uma das duas.
  const bloqueadasSab = getBlocked('fds', sabKey);
  const bloqueadasDom = getBlocked('fds', domKey);
  const idsBase = _rotinasFds
    .filter(r => !r.semStatus && r.secao !== 'Corvu Sábado' && r.secao !== 'Corvu Domingo')
    .map(r => r.id);

  const todasRotinasOk = idsBase.length > 0 && idsBase.every(id => {
    // Bloqueada nos dois → ok
    if (bloqueadasSab.includes(id) && bloqueadasDom.includes(id)) return true;
    // Encerrada+fim em qualquer uma das duas chaves → ok
    const vSab = sStatusSab[id];
    const vDom = sStatusDom[id];
    const okSab = vSab && vSab.status === 'encerrado' && vSab.fim && vSab.fim.trim() !== '';
    const okDom = vDom && vDom.status === 'encerrado' && vDom.fim && vDom.fim.trim() !== '';
    return okSab || okDom;
  });

  if (!todasRotinasOk) return true; // ainda há rotinas pendentes

  // Corvus inline do FDS
  const dadosCorvuSab = getCorvuDados('corvufds_corvu_sabado');
  const dadosCorvuDom = getCorvuDados('corvufds_corvu_domingo');
  const valsCorvuSab = Object.values(dadosCorvuSab).filter(v => v && (v.inicio || v.fim));
  const valsCorvuDom = Object.values(dadosCorvuDom).filter(v => v && (v.inicio || v.fim));

  const corvuSabOk = valsCorvuSab.length === 0 || valsCorvuSab.every(v => v.fim && v.fim.trim() !== '');
  const corvuDomOk = valsCorvuDom.length === 0 || valsCorvuDom.every(v => v.fim && v.fim.trim() !== '');

  if (!corvuSabOk || !corvuDomOk) return true; // corvu ainda sem fim

  // Tudo encerrado+fim — calcula o fim mais tardio entre tudo
  let fimMaisTardio = null;
  const atualizarFimFds = (fim, baseKey) => {
    if (!fim) return;
    let dt = new Date(`${baseKey}T${fim}:00`);
    if (dt > agora) {
      const ant = getDiaAnteriorKey(baseKey);
      const dtAnt = new Date(`${ant}T${fim}:00`);
      if (dtAnt <= agora) dt = dtAnt;
    }
    if (!fimMaisTardio || dt > fimMaisTardio) fimMaisTardio = dt;
  };

  idsBase.forEach(id => {
    const vSab = sStatusSab[id]; if (vSab?.fim) atualizarFimFds(vSab.fim, sabKey);
    const vDom = sStatusDom[id]; if (vDom?.fim) atualizarFimFds(vDom.fim, domKey);
  });
  valsCorvuSab.forEach(v => { if (v?.fim) atualizarFimFds(v.fim, sabKey); });
  valsCorvuDom.forEach(v => { if (v?.fim) atualizarFimFds(v.fim, domKey); });

  if (!fimMaisTardio) return true;
  return (agora - fimMaisTardio) < DELAY_MS;
}

// ── DIÁRIO DO DIA ATUAL — controle de sumir após 15 min ──────────────
// Retorna true se a aba Diário do dia atual deve ser exibida.
// Regras:
//   - Se nenhuma rotina tem status → exibe normalmente (ainda sem dados).
//   - Se alguma rotina não está encerrada+fim → exibe (pendente).
//   - Só oculta quando TODAS as rotinas (exceto semStatus e bloqueadas) estão
//     encerradas COM horário de fim E já passaram 15 min do último fim.
function diarioDiaAtualDeveExibir() {
  const sRotinas = getStatus('diario', diaAtual);
  const bloqueadas = getBlocked('diario', diaAtual);
  const idsParaVerificar = _rotinasDiaria
    .filter(r => !r.semStatus)
    .map(r => r.id)
    .filter(id => !bloqueadas.includes(id));

  if (idsParaVerificar.length === 0) return true; // todas bloqueadas → exibe

  const todasEncerradasComFim = idsParaVerificar.every(id => {
    const v = sRotinas[id];
    return v && v.status === 'encerrado' && v.fim && v.fim.trim() !== '';
  });
  if (!todasEncerradasComFim) return true; // ainda há pendentes → exibe

  // Todas encerradas com fim — calcula 15 min após o último fim
  const DELAY_MS = 15 * 60 * 1000;
  const agora = new Date();
  let fimMaisTardio = null;
  idsParaVerificar.forEach(id => {
    const v = sRotinas[id];
    if (v && v.fim) {
      let dtFim = new Date(`${diaAtual}T${v.fim}:00`);
      if (dtFim > agora) {
        const ontem = getDiaAnteriorKey(diaAtual);
        const dtOntem = new Date(`${ontem}T${v.fim}:00`);
        if (dtOntem <= agora) dtFim = dtOntem;
      }
      if (!fimMaisTardio || dtFim > fimMaisTardio) fimMaisTardio = dtFim;
    }
  });
  if (!fimMaisTardio) return true;
  return (agora - fimMaisTardio) < DELAY_MS;
}

// ── CORVU DIÁRIO (aba corvudiario) — controle de sumir após 15 min ───
// Retorna true se a aba Corvu Diário do dia atual deve ser exibida.
// Regras:
//   - Enquanto nenhuma linha tiver qualquer dado (início ou fim) → exibe normalmente.
//   - Quando há linhas preenchidas mas alguma sem fim → exibe (ainda em andamento).
//   - Quando TODAS as linhas com qualquer dado têm fim preenchido → inicia contagem 15 min.
//   - Após 15 min do último fim → oculta a aba.
function corvuDiarioDeveExibir() {
  const dados = getCorvuDados('corvu');
  // Considera linhas que têm início OU fim preenchidos
  const vals = Object.values(dados).filter(v => v && (v.inicio || v.fim));
  if (vals.length === 0) return true; // sem dados → exibe normalmente

  const todasComFim = vals.every(v => v.fim && v.fim.trim() !== '');
  if (!todasComFim) return true; // alguma linha ainda sem fim → continua exibindo

  // Todas têm fim — calcula 15 min após o último fim
  const DELAY_MS = 15 * 60 * 1000;
  const agora = new Date();
  let fimMaisTardio = null;
  vals.forEach(v => {
    if (v.fim) {
      // Corvu do dia pode ter sido executado na madrugada do dia atual
      let dtFim = new Date(`${diaAtual}T${v.fim}:00`);
      // Se ficou no futuro (ex: 23:00 sendo comparado ao dia errado), tenta ontem
      if (dtFim > agora) {
        const ontem = getDiaAnteriorKey(diaAtual);
        const dtFimOntem = new Date(`${ontem}T${v.fim}:00`);
        if (dtFimOntem <= agora) dtFim = dtFimOntem;
      }
      if (!fimMaisTardio || dtFim > fimMaisTardio) fimMaisTardio = dtFim;
    }
  });
  if (!fimMaisTardio) return true;
  return (agora - fimMaisTardio) < DELAY_MS; // false = já passaram 15 min → oculta
}

// ── MENSAL — controle de sumir após 15 min ───────────────────────────
// Retorna true se a aba Mensal deve ser exibida.
// Aparece apenas nos 2 dias antes do último dia do mês + último dia + até sumir.
// Exemplo: mês com 30 dias → aparece do dia 28 em diante.
// Sem status → exibe; só some com todas encerradas+fim+15min.
function mensalDeveExibir() {
  // Calcula o último dia do mês atual
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diaHoje = hoje.getDate();

  // Só aparece nos últimos 3 dias do mês (ultimoDia-2, ultimoDia-1, ultimoDia)
  // OU se já tem status registrado (mês anterior ainda em andamento)
  const dentroDoJanela = diaHoje >= (ultimoDia - 2);

  const sRotinas = getStatus('mensal', null);
  const temAlgumStatus = Object.values(sRotinas).some(v => v && v.status);

  // Fora da janela e sem dados → não exibe
  if (!dentroDoJanela && !temAlgumStatus) return false;

  const bloqueadas = getBlocked('mensal', null);
  const idsParaVerificar = _rotinasMensal
    .filter(r => !r.semStatus)
    .map(r => r.id)
    .filter(id => !bloqueadas.includes(id));

  if (idsParaVerificar.length === 0) return dentroDoJanela;

  // Sem status → exibe se dentro da janela
  if (!temAlgumStatus) return dentroDoJanela;

  const todasEncerradasComFim = idsParaVerificar.every(id => {
    const v = sRotinas[id];
    return v && v.status === 'encerrado' && v.fim && v.fim.trim() !== '';
  });
  if (!todasEncerradasComFim) return true; // pendente → exibe independente do dia

  const DELAY_MS = 15 * 60 * 1000;
  const agora = new Date();
  let fimMaisTardio = null;
  idsParaVerificar.forEach(id => {
    const v = sRotinas[id];
    if (v && v.fim) {
      let dtFim = new Date(`${diaAtual}T${v.fim}:00`);
      if (dtFim > agora) {
        const ontem = getDiaAnteriorKey(diaAtual);
        dtFim = new Date(`${ontem}T${v.fim}:00`);
      }
      if (!fimMaisTardio || dtFim > fimMaisTardio) fimMaisTardio = dtFim;
    }
  });
  if (!fimMaisTardio) return true;
  return (agora - fimMaisTardio) < DELAY_MS;
}

// ── CORVU MENSAL — controle de sumir após 15 min ─────────────────────
// Mesma janela do mensal: aparece nos últimos 3 dias do mês.
// Sem dados → exibe se dentro da janela; some quando todas com fim+15min.
function corvuMensalDeveExibir() {
  // Calcula o último dia do mês atual
  const hoje = new Date();
  const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  const diaHoje = hoje.getDate();
  const dentroDoJanela = diaHoje >= (ultimoDia - 2);

  const dados = getCorvuDados('corvumensal');
  const vals = Object.values(dados).filter(v => v && (v.inicio || v.fim));

  // Fora da janela e sem dados → não exibe
  if (!dentroDoJanela && vals.length === 0) return false;

  // Dentro da janela mas sem dados → exibe
  if (vals.length === 0) return true;

  const todasComFim = vals.every(v => v.fim && v.fim.trim() !== '');
  if (!todasComFim) return true; // pendente → exibe

  const DELAY_MS = 15 * 60 * 1000;
  const agora = new Date();
  let fimMaisTardio = null;
  vals.forEach(v => {
    if (v.fim) {
      let dtFim = new Date(`${diaAtual}T${v.fim}:00`);
      if (dtFim > agora) {
        const ontem = getDiaAnteriorKey(diaAtual);
        dtFim = new Date(`${ontem}T${v.fim}:00`);
      }
      if (!fimMaisTardio || dtFim > fimMaisTardio) fimMaisTardio = dtFim;
    }
  });
  if (!fimMaisTardio) return true;
  return (agora - fimMaisTardio) < DELAY_MS;
}

// ── FDS DINÂMICO POR DATA ─────────────────────────────────────────────
function getFdsAnterioresComPendentes() {
  try {
    const DELAY_MS = 15 * 60 * 1000;
    const agora = new Date();
    const resultado = [];

    for (let semana = 1; semana <= 2; semana++) {
      const hoje = new Date(diaAtual + 'T12:00:00');
      // Se hoje é sábado ou domingo, não mostra FDS anterior da semana 1
      if (semana === 1 && (hoje.getDay() === 6 || hoje.getDay() === 0)) continue;

      // Calcula o sábado da semana anterior
      const diaSemana = hoje.getDay();
      let diasAtras = diaSemana === 0 ? 1 : diaSemana === 6 ? 7 : diaSemana + 1;
      diasAtras += (semana - 1) * 7;
      const sab = new Date(hoje);
      sab.setDate(sab.getDate() - diasAtras);
      const fdsKey = `${sab.getFullYear()}-${String(sab.getMonth()+1).padStart(2,'0')}-${String(sab.getDate()).padStart(2,'0')}`;
      const dom = new Date(sab); dom.setDate(dom.getDate() + 1);
      const domKey = `${dom.getFullYear()}-${String(dom.getMonth()+1).padStart(2,'0')}-${String(dom.getDate()).padStart(2,'0')}`;

      // Se o operador fechou manualmente esta aba, pula
      if (_abaEstahFechada('fds:' + fdsKey)) continue;

      const sStatusSab = getStatus('fds', fdsKey);
      const sStatusDom = getStatus('fds', domKey);

      // Verifica se há chave salva no servidor para este FDS (sábado ou domingo)
      const temChaveNoServidor =
        _cache[getStatusKey('fds', fdsKey)] !== undefined ||
        _cache[getStatusKey('fds', domKey)] !== undefined;

      const temStatus =
        Object.values(sStatusSab).some(v => v && v.status) ||
        Object.values(sStatusDom).some(v => v && v.status);

      // Sem nenhum dado para este FDS — para de buscar semanas anteriores
      if (!temStatus && !temChaveNoServidor) break;

      // Rotinas normais (exceto seções corvu inline, semStatus e bloqueadas)
      const bloqueadasSab = getBlocked('fds', fdsKey);
      const bloqueadasDom = getBlocked('fds', domKey);
      const idsBase = _rotinasFds
        .filter(r => !r.semStatus && r.secao !== 'Corvu Sábado' && r.secao !== 'Corvu Domingo')
        .map(r => r.id);

      // Cada rotina pode estar salva no sábado OU no domingo — aceita qualquer uma das duas
      const todasRotinasOk = idsBase.length > 0 && idsBase.every(id => {
        if (bloqueadasSab.includes(id) && bloqueadasDom.includes(id)) return true;
        const vSab = sStatusSab[id];
        const vDom = sStatusDom[id];
        const okSab = vSab && vSab.status === 'encerrado' && vSab.fim && vSab.fim.trim() !== '';
        const okDom = vDom && vDom.status === 'encerrado' && vDom.fim && vDom.fim.trim() !== '';
        return okSab || okDom;
      });

      // Corvus inline do FDS
      const dadosCorvuSab = getCorvuDados('corvufds_corvu_sabado');
      const dadosCorvuDom = getCorvuDados('corvufds_corvu_domingo');
      const valsCorvuSab = Object.values(dadosCorvuSab).filter(v => v && (v.inicio || v.fim));
      const valsCorvuDom = Object.values(dadosCorvuDom).filter(v => v && (v.inicio || v.fim));
      const corvuSabOk = valsCorvuSab.length === 0 || valsCorvuSab.every(v => v.fim && v.fim.trim() !== '');
      const corvuDomOk = valsCorvuDom.length === 0 || valsCorvuDom.every(v => v.fim && v.fim.trim() !== '');

      if (!todasRotinasOk || !corvuSabOk || !corvuDomOk) {
        resultado.push({ fdsKey }); continue;
      }

      // Tudo encerrado+fim — calcula o fim mais tardio
      let fimMaisTardio = null;
      // helper como arrow para evitar redeclaração de function em loop
      const atualizarFim = (fim, baseKey) => {
        if (!fim) return;
        let dt = new Date(`${baseKey}T${fim}:00`);
        if (dt > agora) {
          const ant = getDiaAnteriorKey(baseKey);
          const dtAnt = new Date(`${ant}T${fim}:00`);
          if (dtAnt <= agora) dt = dtAnt;
        }
        if (!fimMaisTardio || dt > fimMaisTardio) fimMaisTardio = dt;
      };
      idsBase.forEach(id => {
        const vSab = sStatusSab[id]; if (vSab?.fim) atualizarFim(vSab.fim, fdsKey);
        const vDom = sStatusDom[id]; if (vDom?.fim) atualizarFim(vDom.fim, domKey);
      });
      valsCorvuSab.forEach(v => { if (v?.fim) atualizarFim(v.fim, fdsKey); });
      valsCorvuDom.forEach(v => { if (v?.fim) atualizarFim(v.fim, domKey); });

      if (fimMaisTardio && (agora - fimMaisTardio) < DELAY_MS) resultado.push({ fdsKey });
    }
    return resultado;
  } catch(e) { console.error('getFdsAnterioresComPendentes erro:', e); return []; }
}

function getDiasAnterioresComPendentes() {
  const dias = [];
  let chave = diaAtual;
  // IDs das rotinas de madrugada (seções que pertencem ao dia anterior)
  const idsMadrugada = new Set(
    _rotinasDiaria
      .filter(r => SECOES_DIA_ANTERIOR.has(r.secao))
      .map(r => r.id)
  );

  // Função auxiliar: calcula se um dia já deve ser suprimido pelo delay de 15 min.
  // Regras:
  //   1. TODAS as rotinas da lista (exceto semStatus e bloqueadas) precisam estar
  //      encerradas E com horário de fim preenchido.
  //   2. Rotinas sem status, executando, ou encerradas sem fim → aba continua aparecendo.
  //   3. Só quando todas estão encerradas+fim E o Corvu (quando presente) também está ok,
  //      e já passaram 15 min do último fim → suprime.
  //   4. Se todas estão bloqueadas (idsParaVerificar vazio), considera como concluído
  //      para fins de delay — usa o último fim dos que tiverem fim registrado,
  //      ou suprime imediatamente se nenhum tiver fim.
  //   5. O Corvu é tratado de forma independente: mesmo que as rotinas já tenham
  //      suprimido, o corvu mantém a aba até terminar todos + 15 min.
  function _calcularSupressao(sRotinas, sCorvu, chaveBase, isDiaImediato, idsRotinas, bloqueadas) {
    const DELAY_MS = 15 * 60 * 1000;
    const agora = new Date();

    // Helper para construir Date de um fim, tentando diaAtual primeiro se isDiaImediato
    function _parseFim(fim, isDiaImediato) {
      if (!fim) return null;
      if (isDiaImediato) {
        // Rotinas de madrugada executam nas primeiras horas do diaAtual
        const dtAtual = new Date(`${diaAtual}T${fim}:00`);
        if (dtAtual <= agora) return dtAtual;
        // Se ficou no futuro, tenta a chaveBase (dia anterior)
        const dtBase = new Date(`${chaveBase}T${fim}:00`);
        if (dtBase <= agora) return dtBase;
        // Se ainda no futuro (dado futuro inválido), usa dtBase mesmo assim
        return dtBase;
      }
      return new Date(`${chaveBase}T${fim}:00`);
    }

    // ── Rotinas ──────────────────────────────────────────────────────
    const idsParaVerificar = idsRotinas.filter(id => !bloqueadas.includes(id));

    let deveSuprimirPorDelay = false;

    if (idsParaVerificar.length === 0) {
      // Todas bloqueadas — calcula 15 min a partir do último fim registrado
      // entre TODOS os IDs (inclusive os bloqueados que possam ter fim salvo).
      // Se nenhum tiver fim registrado, usa o momento atual como referência
      // (já passaram 15 min desde que foram bloqueadas, que ocorreu no passado).
      let fimReferencia = null;
      idsRotinas.forEach(id => {
        const v = sRotinas[id];
        if (v && v.fim) {
          const dt = _parseFim(v.fim, isDiaImediato);
          if (dt && (!fimReferencia || dt > fimReferencia)) fimReferencia = dt;
        }
      });
      if (fimReferencia) {
        deveSuprimirPorDelay = (agora - fimReferencia) >= DELAY_MS;
      } else {
        // Nenhum fim registrado — usa agora como referência (delay "começa" agora)
        // Na prática significa: passou 0ms, não suprime ainda nesta rodada,
        // mas na próxima verificação (60s depois) também não terá passado 15 min.
        // O operador precisará aguardar 15 min a partir do momento em que bloqueou.
        // Como não temos timestamp de quando bloqueou, usamos o momento atual → não suprime.
        deveSuprimirPorDelay = false;
      }
    } else {
      const todasRotinasComFim = idsParaVerificar.every(id => {
        const v = sRotinas[id];
        return v && v.status === 'encerrado' && v.fim && v.fim.trim() !== '';
      });

      if (todasRotinasComFim) {
        // Calcula o último fim entre as rotinas não-bloqueadas que têm fim registrado
        let fimMaisTardio = null;
        idsParaVerificar.forEach(id => {
          const v = sRotinas[id];
          if (v && v.fim) {
            const dt = _parseFim(v.fim, isDiaImediato);
            if (dt && (!fimMaisTardio || dt > fimMaisTardio)) fimMaisTardio = dt;
          }
        });
        if (fimMaisTardio) {
          deveSuprimirPorDelay = (agora - fimMaisTardio) >= DELAY_MS;
        } else {
          // Todas encerradas mas nenhuma tem fim registrado → aguarda preenchimento
          deveSuprimirPorDelay = false;
        }
      }
      // se !todasRotinasComFim → deveSuprimirPorDelay fica false (aba continua)
    }

    // ── Corvu ─────────────────────────────────────────────────────────
    // O Corvu é independente: mesmo que as rotinas já sumiram, o corvu mantém
    // a aba até todos os corvus terem fim + 15 min decorridos.
    const temCorvu = Object.values(sCorvu).some(v => v && v.inicio);
    let deveSuprimirCorvu = false;
    if (temCorvu) {
      const corvuVals = Object.values(sCorvu).filter(v => v && v.inicio);
      const todasCorvuComFim = corvuVals.every(v => v.fim && v.fim.trim() !== '');

      if (todasCorvuComFim) {
        let fimCorvu = null;
        corvuVals.forEach(v => {
          if (v.fim) {
            const dt = _parseFim(v.fim, isDiaImediato);
            if (dt && (!fimCorvu || dt > fimCorvu)) fimCorvu = dt;
          }
        });
        if (fimCorvu) {
          deveSuprimirCorvu = (agora - fimCorvu) >= DELAY_MS;
        }
        // se fimCorvu nulo → deveSuprimirCorvu false (aguarda)
      }
      // se algum corvu sem fim → deveSuprimirCorvu false (aba continua)
    }

    return { deveSuprimirPorDelay, temCorvu, deveSuprimirCorvu };
  }

  for (let i = 0; i < 3; i++) {
    chave = getDiaAnteriorKey(chave);
    // Se o operador fechou manualmente esta aba, pula
    if (_abaEstahFechada('dia:' + chave)) continue;
    const sRotinas = getStatus('diario', chave);
    const sCorvu = getCorvuDadosDia(chave);

    // Rotinas com qualquer status marcado
    const temRotinasComStatus = Object.values(sRotinas).some(v => v && v.status);

    // Corvu tem dados se alguma linha tem início registrado
    const temCorvu = Object.values(sCorvu).some(v => v && v.inicio);

    // Verifica se há chave de status salva no servidor para este dia
    const chaveStatus = getStatusKey('diario', chave);
    const temChaveNoServidor = _cache[chaveStatus] !== undefined;

    // Chave corvu no servidor
    const chaveCorvu = 'corvu_dados_corvu_' + chave;
    const temChaveCorvuNoServidor = _cache[chaveCorvu] !== undefined;

    if (!temRotinasComStatus && !temCorvu && !temChaveNoServidor && !temChaveCorvuNoServidor) {
      // Nenhum dado registrado em nenhum lugar para este dia — para de buscar dias anteriores
      break;
    }

    const isDiaImediato = (i === 0);
    // IDs das rotinas da lista que não são semStatus (precisam de status encerrado+fim)
    const idsRotinas = _rotinasDiaria.filter(r => !r.semStatus).map(r => r.id);
    const bloqueadas = getBlocked('diario', chave);
    const { deveSuprimirPorDelay, deveSuprimirCorvu } = _calcularSupressao(sRotinas, sCorvu, chave, isDiaImediato, idsRotinas, bloqueadas);

    // Rotinas: a aba aparece se há dados salvos no servidor E ainda não deve sumir.
    // Deve sumir APENAS quando todas estão encerradas+fim+15min (deveSuprimirPorDelay=true).
    // Se não tem status nenhum ainda (temRotinasComStatus=false) mas tem chave no servidor,
    // mantém a aba visível para que o operador possa registrar os status.
    const temDadosRotinas = temRotinasComStatus || temChaveNoServidor;
    const rotinasAtivas = temDadosRotinas && !deveSuprimirPorDelay;
    // Corvu: some só após delay do próprio corvu (independente das rotinas)
    const corvuAtivo = temCorvu && !deveSuprimirCorvu;

    // Se nem rotinas nem corvu estão ativos → não adiciona (aba some completamente)
    if (!rotinasAtivas && !corvuAtivo) continue;

    dias.push({ diaKey: chave, temRotinas: rotinasAtivas, temCorvu: corvuAtivo });
  }
  return dias;
}

// Corvu diário agora salva por data para suportar dia anterior
function getCorvuDadosDia(diaKey) {
  const k = 'corvu_dados_corvu_' + (diaKey || diaAtual);
  return _parseCorvuDados(lerChave(k));
}
async function saveCorvuCampoDia(diaKey, idx, campo, val) {
  const k = 'corvu_dados_corvu_' + (diaKey || diaAtual);
  // Protege imediatamente contra o polling sobrescrever
  _localTimestamp[k] = Date.now();
  const d = getCorvuDadosDia(diaKey);
  if (!d[idx]) d[idx] = {};
  d[idx][campo] = val;
  // Atualiza o cache local ANTES de enviar — evita sobrescrita pelo polling
  _cache[k] = JSON.stringify(d);
  // Coloca na fila antes do fetch — garante reenvio se falhar
  _filaSalvamento[k] = JSON.stringify(d);
  atualizarIndicadorPendentes();
  try {
    const r = await fetch(API_SALVAR, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ chave: k, valor: JSON.stringify(d) })
    });
    if (r.ok) {
      delete _filaSalvamento[k];
    }
  } catch { /* ficará na fila e será reenviado pelo flushPendentes */ }
  atualizarIndicadorPendentes();
}

function garantirTabDinamica(diaKey) {
  // IDs usados: tab-diario-YYYY-MM-DD, tab-corvu-YYYY-MM-DD, tab-fds-YYYY-MM-DD
  const idRotinas = 'tab-diario-' + diaKey;
  const idCorvu   = 'tab-corvu-'  + diaKey;
  const idFds     = 'tab-fds-'    + diaKey;
  if (!document.getElementById(idRotinas)) {
    const d1 = document.createElement('div');
    d1.id = idRotinas; d1.className = 'tab-content';
    document.body.appendChild(d1);
  }
  if (!document.getElementById(idCorvu)) {
    const d2 = document.createElement('div');
    d2.id = idCorvu; d2.className = 'tab-content';
    document.body.appendChild(d2);
  }
  if (!document.getElementById(idFds)) {
    const d3 = document.createElement('div');
    d3.id = idFds; d3.className = 'tab-content';
    document.body.appendChild(d3);
  }
}

function renderTabBar() {
  const diasAnt = getDiasAnterioresComPendentes();
  const fdsAnt  = getFdsAnterioresComPendentes();

  // Garante que os divs das abas dinâmicas existam
  diasAnt.forEach(({ diaKey }) => garantirTabDinamica(diaKey));
  fdsAnt.forEach(({ fdsKey }) => garantirTabDinamica(fdsKey));

  const [,m,d] = diaAtual.split('-');
  let html = '';

  // Abas do dia anterior (aparecem antes das abas do dia atual)
  diasAnt.forEach(({ diaKey, temRotinas, temCorvu }) => {
    const [,am,ad] = diaKey.split('-');
    const label = `${ad}/${am}`;
    const idR = 'tab-diario-' + diaKey;
    const idC = 'tab-corvu-'  + diaKey;
    // Se apenas o corvu ainda está ativo e o usuário está na aba de rotinas, redireciona
    if (!temRotinas && abaAtiva === idR) abaAtiva = idC;
    html += `<span class="tab-anterior-grupo">
      ${temRotinas ? `<button class="tab-btn tab-btn-anterior${abaAtiva===idR?' active':''}" onclick="abrirTab('${idR}')">⚠️ Diário ${label}</button>` : ''}
      ${temCorvu   ? `<button class="tab-btn tab-btn-anterior${abaAtiva===idC?' active':''}" onclick="abrirTab('${idC}')">⚠️ Corvu ${label}</button>` : ''}
    </span>`;
  });

  // Abas do FDS anterior
  fdsAnt.forEach(({ fdsKey }) => {
    const [,fm,fd] = fdsKey.split('-');
    const label = `${fd}/${fm}`;
    const idF = 'tab-fds-' + fdsKey;
    html += `<span class="tab-anterior-grupo">
      <button class="tab-btn tab-btn-anterior${abaAtiva===idF?' active':''}" onclick="abrirTab('${idF}')">⚠️ FDS ${label}</button>
    </span>`;
  });

  // Abas fixas normais — filtra as que devem ser ocultadas por regra de sumiço
  TABS.forEach(t => {
    // Aba diário do dia atual: só some quando todas encerradas+fim+15min
    if (t.id === 'diario' && !diarioDiaAtualDeveExibir()) {
      if (abaAtiva === 'diario') abaAtiva = 'fds';
      return;
    }
    // Aba corvu diário do dia atual: só some quando todas com fim+15min
    if (t.id === 'corvudiario' && !corvuDiarioDeveExibir()) {
      if (abaAtiva === 'corvudiario') abaAtiva = diarioDiaAtualDeveExibir() ? 'diario' : 'fds';
      return;
    }
    // Aba final de semana do dia atual: só some quando todas encerradas+fim+15min
    if (t.id === 'fds' && !fdsDiaAtualDeveExibir()) {
      if (abaAtiva === 'fds') abaAtiva = diarioDiaAtualDeveExibir() ? 'diario' : 'mensal';
      return;
    }
    // Aba mensal: só some quando todas encerradas+fim+15min (ou fora da janela)
    if (t.id === 'mensal' && !mensalDeveExibir()) {
      if (abaAtiva === 'mensal') abaAtiva = 'anual';
      return;
    }
    // Aba corvu mensal: só some quando todas com fim+15min (ou fora da janela)
    if (t.id === 'corvumensal' && !corvuMensalDeveExibir()) {
      if (abaAtiva === 'corvumensal') abaAtiva = mensalDeveExibir() ? 'mensal' : 'anual';
      return;
    }
    // Aba anual: sempre exibe (sem controle de sumiço)
    html += `<button class="tab-btn${abaAtiva===t.id?' active':''}" onclick="abrirTab('${t.id}')">${t.label}</button>`;
  });
  html += `<button class="tab-btn" onclick="window.location.href='horarios.html'">🗓️ Horários</button>`;

  document.getElementById('tabBar').innerHTML = html;
}

function abrirTab(id) {
  abaAtiva = id;
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  // Abas dinâmicas já têm ID completo (tab-diario-YYYY-MM-DD)
  // Abas fixas têm ID sem prefixo (diario, mensal, etc.)
  const el = document.getElementById(id) || document.getElementById('tab-' + id);
  if (el) el.classList.add('active');
  renderTabBar(); renderAll();
}

// ── RENDER ALL ────────────────────────────────────────────────────────
function renderAll() {
  const a = abaAtiva;

  // Abas dinâmicas do dia anterior
  if (a.startsWith('tab-diario-')) {
    const dk = a.replace('tab-diario-', '');
    garantirTabDinamica(dk);
    renderRotinas('diario-' + dk, _rotinasDiaria, 'diario', dk);
    return;
  }
  if (a.startsWith('tab-corvu-')) {
    const dk = a.replace('tab-corvu-', '');
    garantirTabDinamica(dk);
    const tab = document.getElementById(a);
    if (tab) {
      tab.innerHTML = `<div class="movimento-header">${getMovimentoHeaderCorvu(dk)}</div><div id="corvu-inner-${dk}"></div>`;
      renderCorvuDia('corvu-inner-' + dk, _rotinasCorvu, dk);
    }
    return;
  }
  if (a.startsWith('tab-fds-')) {
    const dk = a.replace('tab-fds-', '');
    garantirTabDinamica(dk);
    renderRotinas('fds-' + dk, _rotinasFds, 'fds', dk);
    return;
  }

  if(a==='diario')      renderRotinas('diario',      _rotinasDiaria,       'diario',      diaAtual);
  if(a==='corvudiario') renderCorvu('corvudiario',   _rotinasCorvu,        'corvu');
  if(a==='fds')         renderRotinas('fds',         _rotinasFds,          'fds',         diaAtual);
  if(a==='mensal')      renderRotinas('mensal',      _rotinasMensal,       'mensal',      null);
  if(a==='corvumensal') renderCorvu('corvumensal',   _rotinasCrvMensal,    'corvumensal');
  if(a==='anual')       renderRotinas('anual',       ROTINAS_ANUAIS,       'anual',       null);
}

function exportarPDF() {
  const nomes = { diario:'Diaria', corvudiario:'Corvu_Diario', fds:'Final_de_Semana',
                  mensal:'Mensal', corvumensal:'Corvu_Mensal', anual:'Anual' };

  // Para abas dinâmicas do dia anterior, usa a data da aba, não diaAtual
  let dkPDF = diaAtual;
  if (abaAtiva.startsWith('tab-diario-')) dkPDF = abaAtiva.replace('tab-diario-', '');
  else if (abaAtiva.startsWith('tab-corvu-')) dkPDF = abaAtiva.replace('tab-corvu-', '');
  else if (abaAtiva.startsWith('tab-fds-'))   dkPDF = abaAtiva.replace('tab-fds-', '');

  const [y,m,d] = dkPDF.split('-');
  const nomeAba = nomes[abaAtiva] || (
    abaAtiva.startsWith('tab-diario-') ? 'Diaria' :
    abaAtiva.startsWith('tab-corvu-')  ? 'Corvu_Diario' :
    abaAtiva.startsWith('tab-fds-')    ? 'Final_de_Semana' : abaAtiva
  );
  const nomePDF = `${nomeAba}_${d}-${m}-${y}`;
  document.title = nomePDF;

  const tabAtiva = document.querySelector('.tab-content.active');
  const substituicoes = [];

  tabAtiva.querySelectorAll('input, textarea, select').forEach(el => {
    const span = document.createElement('span');
    span.className = 'print-value';
    if (el.tagName === 'SELECT') {
      const opt = el.options[el.selectedIndex];
      span.textContent = opt ? opt.text : '';
      if (el.value === 'executando') span.style.color = '#1a7f37';
      else if (el.value === 'encerrado') span.style.color = '#1a7f37';
      else if (el.value === 'erro') span.style.color = '#cf222e';
      else span.style.color = '#888';
    } else {
      span.textContent = el.value || '—';
    }
    el.parentNode.insertBefore(span, el);
    el.style.display = 'none';
    substituicoes.push({ el, span });
  });

  window.print();

  setTimeout(() => {
    substituicoes.forEach(({ el, span }) => {
      el.style.display = '';
      span.remove();
    });
    document.title = 'Operações – Coamo';
  }, 1500);
}

// ── DATA / HORA ───────────────────────────────────────────────────────
function getDiaKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getDiaAnteriorKey(key) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d); dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function formatarDataKey(key) { const [y,m,d]=key.split('-'); return `${d}/${m}/${y}`; }
function getMovimentoHeader(diaKey) {
  const [y,m,d] = (diaKey || diaAtual).split('-');
  return `ROTINAS DO UNIFACE - MOVIMENTO DO DIA – ${d}/${m}/${y}`;
}
function getMovimentoHeaderCorvu(diaKey) {
  const [y,m,d] = (diaKey || diaAtual).split('-');
  return `ROTINAS DO CORVU - MOVIMENTO DO DIA – ${d}/${m}/${y}`;
}
// Retorna YYYY-MM do mês de referência do mensal.
// Regra: dias 1–15 → mês anterior (o mensal ainda está em andamento)
//        dias 16–fim → mês atual (novo ciclo mensal ainda não começou)
function getMesReferencia() {
  const hoje = new Date();
  const dia = hoje.getDate();
  if (dia <= 15) {
    // mês anterior
    const ref = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
    const y = ref.getFullYear();
    const m = String(ref.getMonth() + 1).padStart(2, '0');
    return `${y}-${m}`;
  } else {

    return `${y}-${m}`;
  }
}

function horaParaMin(h) { if(!h||!h.match(/^\d{2}:\d{2}/))return -1; const[hh,mm]=h.split(':'); return parseInt(hh)*60+parseInt(mm); }
let diaAtual = getDiaKey();

// Abas fechadas manualmente — persiste no localStorage com a data de fechamento.

// A aba só fica suprimida enquanto não há pendências nela. Se reabrir com pendência nova,
// o fechamento é ignorado automaticamente.
const _abasFechadasKey = 'abas_fechadas';

function _lerAbasFechadas() {

// ── STORAGE (API servidor + localStorage fallback) ────────────────────
// Sempre usa API (o site roda no servidor)
const USAR_API = location.protocol === 'http:' || location.protocol === 'https:';
const API_URL       = '/api/dados';
const API_SALVAR    = '/api/salvar';

// Cache local dos dados (evita leituras repetidas)
let _cache = {};

// Timestamp da última modificação local por chave
// Impede que o polling sobrescreva dados que acabaram de ser editados localmente
const _localTimestamp = {};

// Carrega todos os dados do servidor na inicialização
async function carregarDadosServidor() {
  if (!USAR_API) return;
  try {
    const r = await fetch(API_URL, { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) { sessionStorage.clear(); window.location.href = 'index.html'; return; }
    if (r.ok) {
      _cache = await r.json();
      Object.entries(_cache).forEach(([k,v]) => {
        try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch {}
      });
    }
  } catch { /* servidor offline — usa localStorage */ }
}

// Fila de salvamentos pendentes para retry em caso de falha
const _filaSalvamento = {};

// Salva uma chave no servidor e no localStorage
async function salvarChave(chave, valor) {
  const valorStr = typeof valor === 'string' ? valor : JSON.stringify(valor);
  try { localStorage.setItem(chave, valorStr); } catch {}
  if (USAR_API) _cache[chave] = valorStr;
  // Marca o timestamp local — polling não pode sobrescrever por 10 segundos
  _localTimestamp[chave] = Date.now();
  if (!USAR_API) return;
  // Marca como pendente (será reenviado se falhar)
  _filaSalvamento[chave] = valorStr;
  try {
    const r = await fetch(API_SALVAR, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ chave, valor: valorStr })
    });
    if (r.ok) {
      delete _filaSalvamento[chave]; // removido da fila após sucesso
    }
  } catch { /* servidor offline — será reenviado pelo flushPendentes */ }
}

// Reenvia dados que não foram salvos no servidor (ex: conexão caiu)
async function flushPendentes() {
  const chaves = Object.keys(_filaSalvamento);
  for (const chave of chaves) {
    try {
      const r = await fetch(API_SALVAR, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ chave, valor: _filaSalvamento[chave] })
      });
      if (r.ok) delete _filaSalvamento[chave];
    } catch { break; } // servidor ainda offline, tenta na próxima
  }
}

// Lê uma chave (do cache/localStorage)
function lerChave(chave) {
  if (USAR_API && _cache[chave] !== undefined) {
    const v = _cache[chave];
    return typeof v === 'string' ? v : JSON.stringify(v);
  }
  return localStorage.getItem(chave);
}

// Indicador visual de pendentes
function atualizarIndicadorPendentes() {
  const qtd = Object.keys(_filaSalvamento).length;
  let el = document.getElementById('indicadorPendentes');
  if (!el) {
    el = document.createElement('span');
    el.id = 'indicadorPendentes';
    el.style.cssText = 'font-size:0.75rem;padding:2px 6px;border-radius:10px;margin-right:6px;display:none;';
    const badge = document.getElementById('userBadge');
    if (badge) badge.parentNode.insertBefore(el, badge);
  }
  if (qtd > 0) {
    el.style.display = 'inline';
    el.style.background = '#fff3cd';
    el.style.color = '#856404';
    el.textContent = '⏳ Salvando...';
  } else {
    el.style.display = 'none';
  }
}

// Polling: atualiza dados do servidor a cada 2 segundos (quando em modo web)
// PROTEGER_POR_MS: após salvar localmente, ignora o servidor por este tempo
// Valor baixo (1500ms) garante que outros usuários vejam mudanças rapidamente
const PROTEGER_POR_MS = 1500;

// Compara dois valores JSON de forma profunda (ignora ordem das chaves)
function _valoresIguais(a, b) {
  if (a === b) return true;
  try {
    const pa = typeof a === 'string' ? JSON.parse(a) : a;
    const pb = typeof b === 'string' ? JSON.parse(b) : b;
    return JSON.stringify(pa) === JSON.stringify(pb);
  } catch { return a === b; }
}

function iniciarPolling() {
  if (!USAR_API) return;
  setInterval(async () => {
    // Tenta reenviar dados pendentes antes de buscar novos
    if (Object.keys(_filaSalvamento).length > 0) {
      await flushPendentes();
      atualizarIndicadorPendentes();
    }
    try {
      const r = await fetch(API_URL + '?t=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (r.status === 401) { sessionStorage.clear(); window.location.href = 'index.html'; return; }
      if (r.ok) {
        const novos = await r.json();
        const agora = Date.now();
        let mudou = false;
        Object.entries(novos).forEach(([k,v]) => {
          const vStr = typeof v === 'string' ? v : JSON.stringify(v);
          // Não sobrescreve se:
          // 1) dado ainda está na fila de envio, OU
          // 2) foi editado localmente há menos de PROTEGER_POR_MS
          const editadoRecente = _localTimestamp[k] && (agora - _localTimestamp[k]) < PROTEGER_POR_MS;
          if (!_filaSalvamento[k] && !editadoRecente) {
            // Proteção extra para chaves Corvu: nunca sobrescreve com dado vazio
            // se o cache local já tem dados
            if (k.startsWith('corvu_dados_')) {
              try {
                const localObj = JSON.parse(_cache[k] || '{}');
                const servidorObj = JSON.parse(vStr || '{}');
                const localTemDados = Object.keys(localObj).length > 0;
                const servidorTemDados = Object.keys(servidorObj).length > 0;
                if (localTemDados && !servidorTemDados) return;
              } catch {}
            }
            // Comparação profunda para evitar false-negative por ordem de chaves JSON
            if (!_valoresIguais(_cache[k], vStr)) {
              _cache[k] = vStr;
              mudou = true;
            }
          }
        });
        if (mudou) atualizarSemPerderFoco();
      }
    } catch {}
  }, 2000);
}

// Atualiza a tela sem sobrescrever campos que o usuário está editando
// e sem perder a posição de scroll
function atualizarSemPerderFoco() {
  const focusado = document.activeElement;
  const tagAtiva = focusado ? focusado.tagName : '';

  // Sempre preserva o scroll antes de re-renderizar
  const scrollAntes = window.scrollY;

  // Se nenhum campo está em foco, re-renderiza e restaura só o scroll
  if (tagAtiva !== 'INPUT' && tagAtiva !== 'TEXTAREA' && tagAtiva !== 'SELECT') {
    renderAll();
    window.scrollTo(0, scrollAntes);
    return;
  }

  // Há um campo em foco: captura tudo necessário para restaurar depois
  const valorAntes    = focusado.value;
  const selStart      = focusado.selectionStart;
  const selEnd        = focusado.selectionEnd;
  const idAntes       = focusado.id;
  const onblurAntes   = focusado.getAttribute('onblur')   || '';
  const onchangeAntes = focusado.getAttribute('onchange') || '';
  const onkeydownAntes= focusado.getAttribute('onkeydown')|| '';

  // Índice posicional do campo entre todos os inputs/textareas/selects visíveis
  // (usado como último recurso para reencontrar o campo)
  const todosInputs = [...document.querySelectorAll('input,textarea,select')];
  const idxAntes    = todosInputs.indexOf(focusado);

  renderAll();
  window.scrollTo(0, scrollAntes);

  // 1º — tenta pelo id
  let novoFoco = idAntes ? document.getElementById(idAntes) : null;

  // 2º — tenta pelo onblur (mais estável para rotinas)
  if (!novoFoco && onblurAntes) {
    novoFoco = [...document.querySelectorAll('input,textarea,select')]
      .find(el => el.getAttribute('onblur') === onblurAntes) || null;
  }

  // 3º — tenta pelo onchange (para selects de status)
  if (!novoFoco && onchangeAntes) {
    novoFoco = [...document.querySelectorAll('select')]
      .find(el => el.getAttribute('onchange') === onchangeAntes) || null;
  }

  // 4º — tenta pelo onkeydown (campos de hora)
  if (!novoFoco && onkeydownAntes) {
    novoFoco = [...document.querySelectorAll('input')]
      .find(el => el.getAttribute('onkeydown') === onkeydownAntes) || null;
  }

  // 5º — fallback posicional (campo na mesma posição do DOM)
  if (!novoFoco && idxAntes >= 0) {
    const todosDepois = [...document.querySelectorAll('input,textarea,select')];
    novoFoco = todosDepois[idxAntes] || null;
  }

  if (novoFoco) {
    novoFoco.focus();
    // Restaura o valor digitado (pode ter sido sobrescrito pelo render)
    if (novoFoco.tagName !== 'SELECT') {
      novoFoco.value = valorAntes;
      try { novoFoco.setSelectionRange(selStart, selEnd); } catch {}
    }
  }
}

// ── Funções de storage que usam a camada unificada ────────────────────
function getStatusKey(p,dk) {
  if (p==='diario'||p==='fds') return 'status_diaria_'+(dk||diaAtual);
  if (p==='mensal') return 'status_mensal_'+getMesReferencia();
  return 'status_'+p;
}
function getStatus(p,dk)    { try{return JSON.parse(lerChave(getStatusKey(p,dk))||'{}')}catch{return{}} }
async function saveStatus(p,obj,dk){ const k=getStatusKey(p,dk); await salvarChave(k,JSON.stringify(obj)); _cache[k]=JSON.stringify(obj); atualizarIndicadorPendentes(); }
function getBlocked(p,dk)   {
  let k;
  if (p==='diario'||p==='fds') k='blocked_diaria_'+(dk||diaAtual);
  else if (p==='mensal') k='blocked_mensal_'+getMesReferencia();
  else k='blocked_'+p;
  try{return JSON.parse(lerChave(k)||'[]')}catch{return[]}
}
async function saveBlocked(p,arr,dk){
  let k;
  if (p==='diario'||p==='fds') k='blocked_diaria_'+(dk||diaAtual);
  else if (p==='mensal') k='blocked_mensal_'+getMesReferencia();
  else k='blocked_'+p;
  await salvarChave(k,JSON.stringify(arr)); _cache[k]=JSON.stringify(arr); atualizarIndicadorPendentes();
}
function getCorvuDados(p) {
  // Para o corvu diário, usa chave datada para suportar dia anterior
  if (p === 'corvu') {
    const k = 'corvu_dados_corvu_' + diaAtual;
    return _parseCorvuDados(lerChave(k));
  }
  // Para o corvu mensal, usa chave baseada no mês de referência
  if (p === 'corvumensal') {
    const k = 'corvu_dados_corvumensal_' + getMesReferencia();
    return _parseCorvuDados(lerChave(k));
  }
  return _parseCorvuDados(lerChave('corvu_dados_'+p));
}

// Parse robusto: aceita string JSON, objeto já parseado, ou duplo-serializado
function _parseCorvuDados(raw) {
  if (!raw) return {};
  try {
    const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
    // Duplo serializado: se ainda for string, parseia de novo
    if (typeof v === 'string') return JSON.parse(v);
    return v || {};
  } catch { return {}; }
}
// Marca timestamp local de uma chave para proteger do polling por 15s
// Chamado no oninput dos campos Corvu para proteger antes do blur/save
function marcarEdicaoLocal(chave) {
  _localTimestamp[chave] = Date.now();
}

async function saveCorvuCampo(p, idx, campo, val) {
  // Para o corvu diário, salva com chave datada
  // Para o corvu mensal, salva com chave baseada no mês de referência
  const chave = p === 'corvu'
    ? 'corvu_dados_corvu_' + diaAtual
    : p === 'corvumensal'
      ? 'corvu_dados_corvumensal_' + getMesReferencia()
      : 'corvu_dados_' + p;
  // Protege imediatamente e por 5 minutos após o save
  _localTimestamp[chave] = Date.now();
  const d = getCorvuDados(p);
  if (!d[idx]) d[idx] = {};
  d[idx][campo] = val;
  // Atualiza o cache local ANTES de enviar ao servidor — evita sobrescrita pelo polling
  _cache[chave] = JSON.stringify(d);
  // Coloca na fila de salvamento antes do fetch — garante reenvio se falhar
  _filaSalvamento[chave] = JSON.stringify(d);
  atualizarIndicadorPendentes();
  try {
    const r = await fetch(API_SALVAR, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ chave, valor: JSON.stringify(d) })
    });
    if (r.ok) {
      delete _filaSalvamento[chave];
    }
  } catch { /* ficará na fila e será reenviado pelo flushPendentes */ }
  atualizarIndicadorPendentes();
}
function getCorvuBlocked(p) {
  // Para o corvu mensal, usa chave baseada no mês de referência
  if (p === 'corvumensal') {
    try { return JSON.parse(lerChave('blocked_corvu_corvumensal_' + getMesReferencia()) || '[]'); } catch { return []; }
  }
  try{return JSON.parse(lerChave('blocked_corvu_'+p)||'[]')}catch{return[]}
}

// ── PERMISSÕES POR PERFIL ─────────────────────────────────────────────
// admin  → pode editar tudo (rotinas + horários)
// operador → pode editar rotinas (status, início, fim, campos)

// ── AÇÕES ─────────────────────────────────────────────────────────────
async function mudarStatus(p,id,val,dk) {
  const s=getStatus(p,dk); if(!s[id])s[id]={};
  s[id].status=val;
  // Limpa a descrição do erro ao sair, mas PRESERVA o chamado e a obs em qualquer status
  if(val!=='erro') s[id].msg='';
  // chamado e obs nunca são apagados ao mudar de status
  await saveStatus(p,s,dk); renderAll();
}
async function mudarCampo(p,id,campo,val,dk) {
  // Salva direto no servidor sem marcar _localTimestamp da chave de status inteira.
  // Isso garante que o polling de outros usuários NÃO seja bloqueado ao editar
  // campos como obs, chamado, msg — que não são status e não devem suprimir sync.
  const k = getStatusKey(p,dk);
  const s = getStatus(p,dk);
  if(!s[id]) s[id]={};
  s[id][campo] = val;
  const valorStr = JSON.stringify(s);
  // Atualiza cache local sem marcar timestamp (não bloqueia polling)
  _cache[k] = valorStr;
  _filaSalvamento[k] = valorStr;
  atualizarIndicadorPendentes();
  try {
    const r = await fetch(API_SALVAR, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ chave: k, valor: valorStr })
    });
    if (r.ok) delete _filaSalvamento[k];
  } catch { /* será reenviado pelo flushPendentes */ }
  atualizarIndicadorPendentes();
}

// Salva hora e re-renderiza (para refletir o estado done quando fim é preenchido)
async function mudarCampoHora(p,id,campo,val,dk) {
  // Mesma lógica que mudarCampo: salva sem marcar _localTimestamp
  // para não bloquear o polling dos outros usuários por 1.5s a cada horário digitado.
  const k = getStatusKey(p,dk);
  const s = getStatus(p,dk);
  if(!s[id]) s[id]={};
  s[id][campo] = val;
  const valorStr = JSON.stringify(s);
  _cache[k] = valorStr;
  _filaSalvamento[k] = valorStr;
  atualizarIndicadorPendentes();
  try {
    const r = await fetch(API_SALVAR, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ chave: k, valor: valorStr })
    });
    if (r.ok) delete _filaSalvamento[k];
  } catch { /* será reenviado pelo flushPendentes */ }
  atualizarIndicadorPendentes();
  renderAll();
}

// TAB nos campos de hora: preenche com horário atual se campo estiver vazio
function _preencherHoraAtual(input) {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  input.value = hh + ':' + mm;
}
function _avancarFoco(input) {
  const inputs = [...document.querySelectorAll('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled])')];
  const idx = inputs.indexOf(input);
  if(idx >= 0 && idx < inputs.length - 1) inputs[idx+1].focus();
}

function autoHoraTab(event,input,p,id,campo,dk) {
  if(event.key !== 'Tab') return;
  if(input.value && input.value.trim() !== '') return; // já tem valor, não sobrescreve
  event.preventDefault();
  _preencherHoraAtual(input);
  mudarCampoHora(p,id,campo,input.value,dk);
  _avancarFoco(input);
}

function autoHoraTabCorvu(event,input,p,idx,campo) {
  if(event.key !== 'Tab') return;
  if(input.value && input.value.trim() !== '') return;
  event.preventDefault();
  _preencherHoraAtual(input);
  saveCorvuCampo(p,idx,campo,input.value);
  _avancarFoco(input);
}

function autoHoraTabCorvuDia(event,input,diaKey,idx,campo) {
  if(event.key !== 'Tab') return;
  if(input.value && input.value.trim() !== '') return;
  event.preventDefault();
  _preencherHoraAtual(input);
  saveCorvuCampoDia(diaKey,idx,campo,input.value);
  _avancarFoco(input);
}
async function toggleBlock(p,id,dk) {
  let b=getBlocked(p,dk); b=b.includes(id)?b.filter(x=>x!==id):[...b,id]; await saveBlocked(p,b,dk); renderAll();
}
async function toggleCorvuBlock(p,idx) {
  let b=getCorvuBlocked(p); b=b.includes(idx)?b.filter(x=>x!==idx):[...b,idx];
  const chaveB = p === 'corvumensal'
    ? 'blocked_corvu_corvumensal_' + getMesReferencia()
    : 'blocked_corvu_' + p;
  await salvarChave(chaveB, JSON.stringify(b));
  _cache[chaveB] = JSON.stringify(b);
  atualizarIndicadorPendentes();
  renderAll();
}

// ── OBSERVAÇÃO DO OPERADOR ────────────────────────────────────────────
// Abre/fecha o campo de edição inline da obs do operador
function toggleObsInput(p, id, dkk) {
  const wrapId = `obs-wrap-${p}-${id}-${dkk}`;

}
async function salvarObsOperador(p, id, dkk) {
  const wrapId = `obs-wrap-${p}-${id}-${dkk}`;
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const ta = wrap.querySelector('textarea');
