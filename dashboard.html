}

// ── BUILD ROTINA HTML ─────────────────────────────────────────────────
function buildRotinaHtml(r,p,dk,blocked,status,agora,temHora,badge) {
  const isBlocked=blocked.includes(r.id);
  const info=status[r.id]||{};
  const st=info.status||'';
  const minR=horaParaMin(r.hora);
  const isCurrent=minR>=0&&agora>=minR&&agora<minR+60;
  const dkk=dk||diaAtual;

  let cls='rotina-item';
  if(isBlocked)cls+=' blocked';
  else if(st==='erro')cls+=' erro';
  // done: encerrado E com horário de fim preenchido — só escurece depois do fim
  else if(st==='encerrado' && info.fim && info.fim.trim()!=='')cls+=' done';
  // encerrado sem fim: mantém visual de "em andamento" até informar o horário final
  else if(st==='encerrado' && (!info.fim || info.fim.trim()===''))cls+=' current';
  else if(st==='executando'||isCurrent)cls+=' current';
  // rotinas semStatus ficam escuras quando qualquer campo foi preenchido
  // se todosOsCampos:true, só fica verde quando TODOS os campos estiverem preenchidos
  else if(r.semStatus && (
    (r.campos && (
      r.todosOsCampos
        ? r.campos.every(c => info[c.k] && info[c.k].trim() !== '')
        : r.campos.some(c => info[c.k] && info[c.k].trim() !== '')
    )) ||
    (r.campo && info.campoval && info.campoval.trim() !== '')
  )) cls+=' done';

  let html=`<div class="${cls}" id="ri_${r.id}_${dkk}">
    <div class="rotina-time">${r.hora}</div>
    <div style="flex:1;min-width:0;">
      <div class="rotina-text">${r.texto}${badge?`<span class="badge-dia-anterior">Rotinas ${badge}</span>`:''}</div>
      ${r.obs?`<div class="rotina-obs">${r.obs}</div>`:''}
      ${r.caminho?`<div class="rotina-caminho">📂 ${r.caminho}</div>`:''}
      ${st==='erro'&&info.msg?`<div class="erro-msg-view">⚠️ ${info.msg}</div>`:''}
      ${info.chamado&&st!=='erro'?`<div class="erro-msg-view" style="color:#ffb74d;">📋 Chamado: ${info.chamado}</div>`:''}
    </div>
    <div class="rotina-actions">
      <div class="rotina-actions-row">
        ${r.semStatus ? '' : `<select class="status-select ${st}" ${isBlocked?'disabled':''} onchange="mudarStatus('${p}','${r.id}',this.value,'${dkk}')">
          <option value="" ${!st?'selected':''}>— Status —</option>
          <option value="executando" ${st==='executando'?'selected':''}>▶ Executando</option>
          <option value="encerrado"  ${st==='encerrado'?'selected':''}>✔ Encerrado</option>
          <option value="erro"       ${st==='erro'?'selected':''}>✖ Erro</option>
        </select>`}
        ${r.campo?`<input type="text" class="campo-extra" placeholder="${r.campo}" value="${info.campoval||''}" onblur="mudarCampo('${p}','${r.id}','campoval',this.value,'${dkk}')${r.semStatus?';renderAll()':''}">`:'' }
        ${!r.campos ? `<button class="btn-block ${isBlocked?'unblock':''}" onclick="toggleBlock('${p}','${r.id}','${dkk}')" title="${isBlocked?'Desbloquear':'Bloquear'}">${isBlocked?'🔓':'🔒'}</button><button class="btn-obs${info.obsOperador?' tem-obs':''}" onclick="toggleObsInput('${p}','${r.id}','${dkk}')" title="Observação do operador">📝</button>` : ''}
      </div>
      ${r.campos?`<div class="rotina-campos-wrap">
        ${r.campos.slice(0, -1).map(c=>`<div class="campo-label-wrap">
          ${c.label?`<span class="campo-label">${c.label}:</span>`:''}
          <input type="text" class="campo-extra" placeholder="${c.label}" value="${info[c.k]||''}" onblur="mudarCampo('${p}','${r.id}','${c.k}',this.value,'${dkk}')${r.semStatus?';renderAll()':''}">
        </div>`).join('')}
        <div class="rotina-campos-ultima">
          ${r.campos[r.campos.length-1].label?`<span class="campo-label">${r.campos[r.campos.length-1].label}:</span>`:''}
          <input type="text" class="campo-extra" placeholder="${r.campos[r.campos.length-1].label}" value="${info[r.campos[r.campos.length-1].k]||''}" onblur="mudarCampo('${p}','${r.id}','${r.campos[r.campos.length-1].k}',this.value,'${dkk}')${r.semStatus?';renderAll()':''}">
          <button class="btn-block ${isBlocked?'unblock':''}" onclick="toggleBlock('${p}','${r.id}','${dkk}')" title="${isBlocked?'Desbloquear':'Bloquear'}">${isBlocked?'🔓':'🔒'}</button>
          <button class="btn-obs${info.obsOperador?' tem-obs':''}" onclick="toggleObsInput('${p}','${r.id}','${dkk}')" title="Observação do operador">📝</button>
        </div>
      </div>`:''}`;

  if(temHora && !r.semStatus) {
    const showI=(st==='executando'||st==='encerrado'||st==='erro');
    const showF=(st==='encerrado'||st==='erro');
    if(showI||showF) {
      html+=`<div class="rotina-actions-row hora-row" style="margin-top:3px;">`;
      if(showI) html+=`<span class="hora-label">Início</span><input type="time" class="hora-input" value="${info.inicio||''}" onblur="mudarCampoHora('${p}','${r.id}','inicio',this.value,'${dkk}')" onkeydown="autoHoraTab(event,this,'${p}','${r.id}','inicio','${dkk}')">`;
      if(showF) html+=`<span class="hora-label">Fim</span><input type="time" class="hora-input" value="${info.fim||''}" onblur="mudarCampoHora('${p}','${r.id}','fim',this.value,'${dkk}')" onkeydown="autoHoraTab(event,this,'${p}','${r.id}','fim','${dkk}')">`;
      html+=`</div>`;
    }
  }

  if(st==='erro') html+=`
    <textarea class="erro-desc" rows="2" placeholder="Descreva o erro..." style="margin-top:5px;" onblur="mudarCampo('${p}','${r.id}','msg',this.value,'${dkk}')">${info.msg||''}</textarea>
    <input type="text" class="chamado-input" placeholder="Nº do Chamado (ex: INC0012345)" value="${info.chamado||''}" onblur="mudarCampo('${p}','${r.id}','chamado',this.value,'${dkk}')">`;

  // Mostra o chamado mesmo apos encerrar (somente leitura, se houver chamado salvo)
  if(st==='encerrado' && info.chamado) html+=`
    <div class="chamado-encerrado">📋 Chamado: <strong>${info.chamado}</strong></div>`;

  // Se a rotina continuou após erro (executando) e já tem chamado/obs — mostra em modo leitura
  if(st==='executando' && info.chamado) html+=`
    <div class="chamado-encerrado" style="color:#ffb74d;background:rgba(255,183,77,0.1);">📋 Chamado aberto: <strong>${info.chamado}</strong>
      ${info.msg ? `<span style="color:#8b949e;font-weight:400;"> — ${info.msg}</span>` : ''}
    </div>`;

  // ── Observação do operador ─────────────────────────────────────────
  // Campo de edição (oculto por padrão, abre ao clicar no 📝)
  html += `<div id="obs-wrap-${p}-${r.id}-${dkk}" class="obs-operador-wrap" style="display:none;">
    <textarea class="obs-operador-input" rows="2" placeholder="Digite a observação...">${info.obsOperador||''}</textarea>
    <button class="obs-operador-salvar" onclick="salvarObsOperador('${p}','${r.id}','${dkk}')">Salvar</button>
  </div>`;
  // Exibição da obs salva (sempre visível quando preenchida)
  if(info.obsOperador && info.obsOperador.trim() !== '') {
    html += `<div class="obs-operador-view"><strong>📝 Obs:</strong>${info.obsOperador}</div>`;
  }

  html+=`</div></div>`;
  return html;
}

// ── RENDER ROTINAS ────────────────────────────────────────────────────
function renderRotinas(tabId,rotinas,p,dk) {
  const tab=document.getElementById('tab-'+tabId);
  if(!tab) return; // segurança: aba não existe no DOM
  const blocked=getBlocked(p,dk), status=getStatus(p,dk), agora=horaAtual();
  const temHora=(p==='diario'||p==='fds'||p==='mensal'||p==='anual');

  // Seções que pertencem ao dia anterior (madrugada) e NÃO devem aparecer na aba do dia atual
  // quando já existe uma aba dinâmica do dia anterior ativa
  const ehAbaDiaAtual = (p === 'diario' && dk === diaAtual);
  const diasAnt = ehAbaDiaAtual ? getDiasAnterioresComPendentes() : [];
  const temAbaDiaAnterior = diasAnt.length > 0;

  // Seções que devem ser renderizadas como tabela Corvu
  const secoesCorvu = new Set(['Corvu Sábado','Corvu Domingo']);

  let html=`<div class="movimento-header">${
    p==='mensal' ? getMovimentoHeaderMensal(dk) :
    p==='anual'  ? getMovimentoHeaderAnual(dk)  :
    getMovimentoHeader(dk)
  }</div>`;

  const secoes={};
  rotinas.forEach(r=>{ if(!secoes[r.secao])secoes[r.secao]=[]; secoes[r.secao].push(r); });

  Object.entries(secoes).forEach(([sec,items])=>{
    // Na aba do dia atual, quando existe aba do dia anterior,
    // oculta as seções de madrugada (elas ficam na aba do dia anterior)
    if(ehAbaDiaAtual && temAbaDiaAnterior && SECOES_DIA_ANTERIOR.has(sec)) return;

    if(secoesCorvu.has(sec)) {
      // Renderiza como tabela Corvu inline
      const corvuPrefix = 'corvufds_' + sec.replace(/\s+/g,'_').toLowerCase();
      const dados = getCorvuDados(corvuPrefix);
      html+=`<div class="rotina-section"><h3>${sec}</h3>
        <div style="overflow-x:auto;">
        <table class="corvu-table"><thead><tr>
          <th>Rotina</th><th>Início</th><th>Fim</th><th>Servidor</th><th>Usuário</th><th>Terminal</th>
        </tr></thead><tbody>`;
      items.forEach((r,idx)=>{
        const d=dados[idx]||{};
        html+=`<tr>
          <td class="corvu-nome">${r.texto}</td>
          <td><input type="time" class="corvu-input" value="${d.inicio||''}" onblur="saveCorvuCampo('${corvuPrefix}',${idx},'inicio',this.value)" onkeydown="autoHoraTabCorvu(event,this,'${corvuPrefix}',${idx},'inicio')"></td>
          <td><input type="time" class="corvu-input" value="${d.fim||''}" onblur="saveCorvuCampo('${corvuPrefix}',${idx},'fim',this.value)" onkeydown="autoHoraTabCorvu(event,this,'${corvuPrefix}',${idx},'fim')"></td>
          <td><input type="text" class="corvu-input upper" placeholder="Servidor" value="${d.servidor||''}" oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${corvuPrefix}')" onblur="saveCorvuCampo('${corvuPrefix}',${idx},'servidor',this.value)"></td>
          <td><input type="text" class="corvu-input upper" placeholder="Usuário" value="${d.usuario||''}" oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${corvuPrefix}')" onblur="saveCorvuCampo('${corvuPrefix}',${idx},'usuario',this.value)"></td>
          <td><input type="text" class="corvu-input upper" placeholder="Terminal" value="${d.terminal||''}" oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${corvuPrefix}')" onblur="saveCorvuCampo('${corvuPrefix}',${idx},'terminal',this.value)"></td>
        </tr>`;
      });
      html+=`</tbody></table></div></div>`;
    } else {
      // Renderiza como rotinas normais
      html+=`<div class="rotina-section"><h3>${sec}</h3>`;
      items.forEach(r=>{ html+=buildRotinaHtml(r,p,dk,blocked,status,agora,temHora,null); });
      html+=`</div>`;
    }
  });
  tab.innerHTML=html;
}

// ── RENDER CORVU ──────────────────────────────────────────────────────
function renderCorvu(tabId,lista,p) {
  const tab = document.getElementById('tab-'+tabId) || document.getElementById(tabId);
  const dados=getCorvuDados(p);
  const comBloqueio=(p==='corvu'||p==='corvumensal');
  const blocked=comBloqueio?getCorvuBlocked(p):[];
  const isMenual=(p==='corvumensal');

  // Cabeçalho: Corvu Diário usa data atual, Corvu Mensal usa título mensal
  const cabecalho = isMenual
    ? getMovimentoHeaderCorvuMensal(diaAtual)
    : getMovimentoHeaderCorvu(diaAtual);

  let html=`<div class="movimento-header">${cabecalho}</div>`;

  // Aviso especial para o Corvu Mensal
  if(isMenual) {
    html+=`<div class="aviso-corvu-mensal">⚠️ Executar somente após atualizar a data mensal do IEPA</div>`;
  }

  html+=`<div style="overflow-x:auto;">
  <table class="corvu-table"><thead><tr>
    <th>Rotina</th>
    ${isMenual?'<th>Observação</th>':''}
    <th>Início</th><th>Fim</th><th>Servidor</th><th>Usuário</th><th>Terminal</th>
    ${comBloqueio?'<th style="width:40px;"></th>':''}
  </tr></thead><tbody>`;

  lista.forEach((item,idx)=>{
    const nome=typeof item==='string'?item:item.nome;
    const obs=typeof item==='object'&&item.obs?item.obs:'';
    const d=dados[idx]||{};
    const isB=blocked.includes(idx);
    html+=`<tr${isB?' class="corvu-bloqueada"':''}>
      <td class="corvu-nome">${nome}${isB?'<span class="badge-bloqueada">BLOQUEADA</span>':''}</td>
      ${isMenual?`<td class="corvu-obs-cell">${obs}</td>`:''}
      <td><input type="time" class="corvu-input" value="${d.inicio||''}" ${isB?'disabled':''} onblur="saveCorvuCampo('${p}',${idx},'inicio',this.value)" onkeydown="autoHoraTabCorvu(event,this,'${p}',${idx},'inicio')"></td>
      <td><input type="time" class="corvu-input" value="${d.fim||''}" ${isB?'disabled':''} onblur="saveCorvuCampo('${p}',${idx},'fim',this.value)" onkeydown="autoHoraTabCorvu(event,this,'${p}',${idx},'fim')"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Servidor" value="${d.servidor||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${p==='corvu'?'corvu_'+diaAtual:p==='corvumensal'?'corvumensal_'+getMesReferencia():p}')" onblur="saveCorvuCampo('${p}',${idx},'servidor',this.value)"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Usuário" value="${d.usuario||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${p==='corvu'?'corvu_'+diaAtual:p==='corvumensal'?'corvumensal_'+getMesReferencia():p}')" onblur="saveCorvuCampo('${p}',${idx},'usuario',this.value)"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Terminal" value="${d.terminal||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_${p==='corvu'?'corvu_'+diaAtual:p==='corvumensal'?'corvumensal_'+getMesReferencia():p}')" onblur="saveCorvuCampo('${p}',${idx},'terminal',this.value)"></td>
      ${comBloqueio?`<td><button class="btn-block ${isB?'unblock':''}" onclick="toggleCorvuBlock('${p}',${idx})">${isB?'🔓':'🔒'}</button></td>`:''}
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  tab.innerHTML=html;
}

// ── RENDER CORVU COM DATA (para abas dinâmicas do dia anterior) ───────
function renderCorvuDia(containerId, lista, diaKey) {
  const tab = document.getElementById('tab-' + containerId) || document.getElementById(containerId);
  if (!tab) return;
  const chaveCorvu = 'corvu_dados_corvu_' + diaKey;
  const chaveBlocked = 'blocked_corvu_dia_' + diaKey;
  let dados = {};
  let blocked = [];
  dados = _parseCorvuDados(lerChave(chaveCorvu));
  try { blocked = JSON.parse(lerChave(chaveBlocked) || '[]'); } catch {}

  let html = `<div style="overflow-x:auto;"><table class="corvu-table"><thead><tr>
    <th>Rotina</th><th>Início</th><th>Fim</th><th>Servidor</th><th>Usuário</th><th>Terminal</th><th style="width:40px;"></th>
  </tr></thead><tbody>`;

  lista.forEach((item, idx) => {
    const nome = typeof item === 'string' ? item : item.nome;
    const d = dados[idx] || {};
    const isB = blocked.includes(idx);
    html += `<tr${isB ? ' class="corvu-bloqueada"' : ''}>
      <td class="corvu-nome">${nome}${isB ? '<span class="badge-bloqueada">BLOQUEADA</span>' : ''}</td>
      <td><input type="time" class="corvu-input" value="${d.inicio||''}" ${isB?'disabled':''} onblur="saveCorvuCampoDia('${diaKey}',${idx},'inicio',this.value)" onkeydown="autoHoraTabCorvuDia(event,this,'${diaKey}',${idx},'inicio')"></td>
      <td><input type="time" class="corvu-input" value="${d.fim||''}" ${isB?'disabled':''} onblur="saveCorvuCampoDia('${diaKey}',${idx},'fim',this.value)" onkeydown="autoHoraTabCorvuDia(event,this,'${diaKey}',${idx},'fim')"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Servidor" value="${d.servidor||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_corvu_${diaKey}')" onblur="saveCorvuCampoDia('${diaKey}',${idx},'servidor',this.value)"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Usuário" value="${d.usuario||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_corvu_${diaKey}')" onblur="saveCorvuCampoDia('${diaKey}',${idx},'usuario',this.value)"></td>
      <td><input type="text" class="corvu-input upper" placeholder="Terminal" value="${d.terminal||''}" ${isB?'disabled':''} oninput="this.value=this.value.toUpperCase();marcarEdicaoLocal('corvu_dados_corvu_${diaKey}')" onblur="saveCorvuCampoDia('${diaKey}',${idx},'terminal',this.value)"></td>
      <td><button class="btn-block ${isB?'unblock':''}" onclick="toggleCorvuBlockDia('${diaKey}',${idx})">${isB?'🔓':'🔒'}</button></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  tab.innerHTML = html;
}

async function toggleCorvuBlockDia(diaKey, idx) {
  const chave = 'blocked_corvu_dia_' + diaKey;
  let blocked = [];
  try { blocked = JSON.parse(lerChave(chave) || '[]'); } catch {}
  blocked = blocked.includes(idx) ? blocked.filter(x => x !== idx) : [...blocked, idx];
  await salvarChave(chave, JSON.stringify(blocked));
  _cache[chave] = JSON.stringify(blocked);
  atualizarIndicadorPendentes();
  renderAll();
}

// ── RELÓGIO ───────────────────────────────────────────────────────────
function atualizarRelogio() {
  const now=new Date();
  document.getElementById('relogioHeader').textContent=
    now.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('pt-BR');
}
function verificarMudancaDia() { const n=getDiaKey(); if(n!==diaAtual){diaAtual=n;renderAll();} }

// ── INIT ──────────────────────────────────────────────────────────────
// Cópias trabalháveis dos arrays base — serão modificadas pelo merge de customizações
let _rotinasDiaria    = [...ROTINAS_DIARIA];
let _rotinasFds       = [...ROTINAS_FDS_NOVO];
let _rotinasMensal    = [...ROTINAS_MENSAL];
let _rotinasCorvu     = [...ROTINAS_CORVU];
let _rotinasCrvMensal = [...ROTINAS_CORVU_MENSAL];

// Carrega customizações da API e faz merge sobre os arrays base
async function carregarRotinasCustum() {
  try {
    const r = await fetch('/api/rotinas', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) return;
    const custom = await r.json();

    // Itens removidos: IDs/nomes marcados para exclusão
    const removidosDiaria    = new Set(custom.removidos_diaria    || []);
    const removidosFds       = new Set(custom.removidos_fds       || []);
    const removidosMensal    = new Set(custom.removidos_mensal    || []);
    const removidosCorvu     = new Set(custom.removidos_corvu     || []);
    const removidosCrvMensal = new Set(custom.removidos_crvmensal || []);

    // Aplica remoções sobre os arrays base
    _rotinasDiaria    = ROTINAS_DIARIA   .filter(r => !removidosDiaria   .has(r.id));
    _rotinasFds       = ROTINAS_FDS_NOVO .filter(r => !removidosFds      .has(r.id));
    _rotinasMensal    = ROTINAS_MENSAL   .filter(r => !removidosMensal   .has(r.id));
    _rotinasCorvu     = ROTINAS_CORVU    .filter(n => !removidosCorvu    .has(n));
    _rotinasCrvMensal = ROTINAS_CORVU_MENSAL.filter(r => !removidosCrvMensal.has(r.nome));

    // Itens adicionados: append ao final de cada lista
    if (custom.adicionados_diaria   ?.length) _rotinasDiaria    = [..._rotinasDiaria,    ...custom.adicionados_diaria];
    if (custom.adicionados_fds      ?.length) _rotinasFds       = [..._rotinasFds,       ...custom.adicionados_fds];
    if (custom.adicionados_mensal   ?.length) _rotinasMensal    = [..._rotinasMensal,    ...custom.adicionados_mensal];
    if (custom.adicionados_corvu    ?.length) _rotinasCorvu     = [..._rotinasCorvu,     ...custom.adicionados_corvu];
    if (custom.adicionados_crvmensal?.length) _rotinasCrvMensal = [..._rotinasCrvMensal, ...custom.adicionados_crvmensal];

    // Aplica ordem global do Corvu Diário (se salva no gerenciador)
    if (custom.ordem_corvu?.length) {
      const ordemMap = new Map();
      custom.ordem_corvu.forEach((nome, i) => ordemMap.set(nome, i));
      // Itens sem posição na ordem vão para o final
      _rotinasCorvu = [..._rotinasCorvu].sort((a, b) => {
        const ia = ordemMap.has(a) ? ordemMap.get(a) : Infinity;
        const ib = ordemMap.has(b) ? ordemMap.get(b) : Infinity;
        return ia - ib;
      });
    }

    // Aplica ordem global do Corvu Mensal (se salva no gerenciador)
    if (custom.ordem_crvmensal?.length) {
      const ordemMap = new Map();
      custom.ordem_crvmensal.forEach((nome, i) => ordemMap.set(nome, i));
      _rotinasCrvMensal = [..._rotinasCrvMensal].sort((a, b) => {
        const ia = ordemMap.has(a.nome) ? ordemMap.get(a.nome) : Infinity;
        const ib = ordemMap.has(b.nome) ? ordemMap.get(b.nome) : Infinity;
        return ia - ib;
      });
    }
  } catch { /* se falhar, usa os arrays base sem alteração */ }
}

carregarDadosServidor()
  .then(() => carregarRotinasCustum())
  .then(() => { renderTabBar(); renderAll(); verificarBtnSincronizar(); });
atualizarRelogio();
iniciarPolling();
setInterval(atualizarRelogio,1000);
setInterval(()=>{verificarMudancaDia();atualizarSemPerderFoco();},60000);
</script>
